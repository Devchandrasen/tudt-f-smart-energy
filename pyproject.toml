[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tudtf-dispatch"
version = "2.0.0"
description = "Causal trust-gated battery dispatch with AC network checks and reproducible benchmark results"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "Chandrasen Pandey"}]
dependencies = [
"numpy==2.3.5",
"pandas==2.3.3",
"scipy==1.18.0",
"matplotlib==3.11.0",
"scikit-learn==1.7.2",
"pandapower==3.3.1",
"simbench==1.6.3"
]

[project.urls]
Repository = "https://github.com/Devchandrasen/tudt-f-smart-energy"
Documentation = "https://github.com/Devchandrasen/tudt-f-smart-energy/tree/main/docs"
Issues = "https://github.com/Devchandrasen/tudt-f-smart-energy/issues"

[project.scripts]
tudtf = "tudtf.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
