name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install study
        run: python -m pip install -e .
          - name: Unit and reference tests
            run: python -m unittest discover -s tests -v
          - name: Compile project source
            run: python -m compileall -q src tests run_segan_study.py analyse_segan.py
      - name: Verify archived study
        run: python -m tudtf verify
      - name: Quick benchmark
        if: runner.os == 'Linux'
        run: python -m tudtf run --quick --output results/ci-quick
      - name: Verify quick results
        if: runner.os == 'Linux'
        run: python -m tudtf verify --results results/ci-quick --skip-hashes
