name: Python check

on:
  push:
  pull_request:

jobs:
  py-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python files
        run: |
          python -m py_compile src/tudtf_core.py scripts/run_rolling_validation.py scripts/run_extended_analysis.py scripts/run_control_and_runtime.py scripts/run_all.py
